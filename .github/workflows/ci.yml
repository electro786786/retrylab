name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
        
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Type check with mypy
        run: mypy src tests
        
      - name: Run tests
        run: pytest tests/
