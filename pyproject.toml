[project]
name = "retrylab"
version = "0.1.0"
description = "Idempotency fuzzer and bug zoo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openapi-core>=0.19.0",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.7.1",
    "hypothesis>=6.100.0",
    "hypothesis-jsonschema>=0.23.0",
    "typer>=0.12.0",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "toxiproxy-python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "mutmut>=2.4.4",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "mkdocs-material>=9.5.17",
    "testcontainers>=4.4.0",
]

[project.scripts]
fuzz = "retrylab.cli:app"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
